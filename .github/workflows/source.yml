name: OS source integrity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce OS-only tracked file boundary
        shell: bash
        run: |
          allowed() {
            case "$1" in
              README.md|AGENTS.md|INTEGRITY.md|TASKS.md|.gitignore|Makefile|linker.ld|.github/workflows/source.yml) return 0 ;;
              boot/*|kernel/*|arch/*|include/*|src/*|tests/*)
                case "$1" in
                  *.c|*.h|*.asm|*.inc|*.S|*.s|*.ld|*.md) return 0 ;;
                esac ;;
            esac
            return 1
          }
          # Prove the boundary rejects unrelated content before auditing the tree.
          for forbidden in dev tools/osenv fixture/boot.asm src/controller.py kernel/vendor.a runs/status.json local/deploy.json; do
            if allowed "$forbidden"; then
              echo "Boundary incorrectly accepts $forbidden"
              exit 1
            fi
          done
          for required in boot/stage1.asm kernel/main.c include/kernel.h Makefile; do
            allowed "$required" || exit 1
          done
          while IFS= read -r -d '' path; do
            if ! allowed "$path"; then
              echo "Unrelated file forbidden in OS repository: $path"
              exit 1
            fi
          done < <(git ls-files -z)
      - name: Fetch pinned external source auditor outside OS checkout
        env:
          HARNESS_COMMIT: 5e5aebfdabd72f31780f4bf25db2a2e87aebefdd
        run: |
          git clone https://github.com/taka6745/osenv.git "$RUNNER_TEMP/osenv"
          git -C "$RUNNER_TEMP/osenv" checkout "$HARNESS_COMMIT"
      - name: Audit OS source boundary and integrity
        run: PYTHONPATH="$RUNNER_TEMP/osenv" python3 -m osenv audit --os-only --repo "$GITHUB_WORKSPACE"

  boot:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned external OS controller
        env:
          HARNESS_COMMIT: 5e5aebfdabd72f31780f4bf25db2a2e87aebefdd
        run: |
          git clone https://github.com/taka6745/osenv.git "$RUNNER_TEMP/osenv"
          git -C "$RUNNER_TEMP/osenv" checkout "$HARNESS_COMMIT"
      - name: Install pinned-build tools
        run: |
          brew update
          if brew list --versions openssl@1.1 >/dev/null 2>&1; then
            brew unlink openssl@1.1
          fi
          openssl_link="$(brew --prefix)/bin/openssl"
          if [ -L "$openssl_link" ] && [ "$(readlink "$openssl_link")" = "$(brew --prefix)/opt/openssl@1.1/bin/openssl" ]; then
            rm "$openssl_link"
          fi
          brew install llvm lld nasm qemu gdb
          brew upgrade llvm lld nasm qemu gdb
      - name: Readable and hand-encoded sanitizers, defects and full disk boot
        run: |
          cd "$RUNNER_TEMP/osenv"
          python3 -m osenv project-test --project "$GITHUB_WORKSPACE" > os-gate.json
          python3 -m osenv project-test --project "$GITHUB_WORKSPACE" --machine-code --machine-http > os-machine-gate.json
      - name: Retain small OS acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-acceptance
          path: |
            ${{ runner.temp }}/osenv/os-gate.json
            ${{ runner.temp }}/osenv/os-machine-gate.json
            ${{ runner.temp }}/osenv/build/**/build.log
            ${{ runner.temp }}/osenv/build/**/mutation-test.log
            ${{ runner.temp }}/osenv/build/**/manifest.json
            ${{ runner.temp }}/osenv/runs/**/serial.log
            ${{ runner.temp }}/osenv/runs/**/status.json
            ${{ runner.temp }}/osenv/runs/**/capture.json
