name: OS source integrity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce OS-only tracked file boundary
        shell: bash
        run: |
          allowed() {
            case "$1" in
              README.md|AGENTS.md|INTEGRITY.md|TASKS.md|.gitignore|Makefile|linker.ld|.github/workflows/source.yml) return 0 ;;
              boot/*|kernel/*|arch/*|include/*|src/*|tests/*)
                case "$1" in
                  *.c|*.h|*.asm|*.inc|*.S|*.s|*.ld|*.md) return 0 ;;
                esac ;;
            esac
            return 1
          }
          # Prove the boundary rejects unrelated content before auditing the tree.
          for forbidden in dev tools/osenv fixture/boot.asm src/controller.py kernel/vendor.a runs/status.json local/deploy.json; do
            if allowed "$forbidden"; then
              echo "Boundary incorrectly accepts $forbidden"
              exit 1
            fi
          done
          for required in boot/stage1.asm kernel/main.c include/kernel.h Makefile; do
            allowed "$required" || exit 1
          done
          while IFS= read -r -d '' path; do
            if ! allowed "$path"; then
              echo "Unrelated file forbidden in OS repository: $path"
              exit 1
            fi
          done < <(git ls-files -z)
      - name: Fetch pinned external source auditor outside OS checkout
        env:
          HARNESS_COMMIT: 13716352a87d7b47b0964ac71cf26d767a300558
        run: |
          git clone https://github.com/taka6745/osenv.git "$RUNNER_TEMP/osenv"
          git -C "$RUNNER_TEMP/osenv" checkout "$HARNESS_COMMIT"
      - name: Audit OS source boundary and integrity
        run: PYTHONPATH="$RUNNER_TEMP/osenv" python3 -m osenv audit --os-only --repo "$GITHUB_WORKSPACE"

  boot:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned external OS controller
        env:
          HARNESS_COMMIT: 13716352a87d7b47b0964ac71cf26d767a300558
        run: |
          git clone https://github.com/taka6745/osenv.git "$RUNNER_TEMP/osenv"
          git -C "$RUNNER_TEMP/osenv" checkout "$HARNESS_COMMIT"
      - name: Install pinned-build tools
        run: |
          brew update
          if brew list --versions openssl@1.1 >/dev/null 2>&1; then
            brew unlink openssl@1.1
          fi
          openssl_link="$(brew --prefix)/bin/openssl"
          if [ -L "$openssl_link" ] && [ "$(readlink "$openssl_link")" = "$(brew --prefix)/opt/openssl@1.1/bin/openssl" ]; then
            rm "$openssl_link"
          fi
          brew install llvm lld nasm qemu gdb
          brew upgrade llvm lld nasm qemu gdb
      - name: Readable and hand-encoded sanitizers, defects and full disk boot
        run: |
          cd "$RUNNER_TEMP/osenv"
          python3 -m osenv project-test --project "$GITHUB_WORKSPACE" > os-gate.json
          python3 -m osenv project-test --project "$GITHUB_WORKSPACE" --machine-code --machine-http > os-machine-gate.json
      - name: Complete hand-encoded OS disk, devices and protocol gate
        run: |
          cd "$RUNNER_TEMP/osenv"
          python3 -m osenv raw-build --project "$GITHUB_WORKSPACE" --output build/raw > os-raw-build.json
          python3 -m osenv raw-test --build build/raw --output local/raw-acceptance > os-raw-gate.json
      - name: Hand-encoded packed boot and optimal storage proof
        run: |
          cd "$RUNNER_TEMP/osenv"
          python3 -m osenv raw-build --project "$GITHUB_WORKSPACE" --output build/raw-packed --packed > os-raw-packed-build.json
          python3 -m osenv raw-test --build build/raw-packed --output local/raw-packed-acceptance > os-raw-packed-gate.json
          python3 -m osenv.raw_packed_test --build build/raw-packed --output local/raw-decoder-acceptance > os-raw-decoder-gate.json
          python3 -m osenv.raw_queue_test --build build/raw-packed --output local/raw-queue-mutant.json --queue-mutant
          python3 -c 'import json; r=json.load(open("local/raw-queue-mutant.json")); assert r["mutant_rejected"] is True and r["ok"] is False'
          python3 -m osenv raw-size --build build/raw-packed --output local/raw-size > os-raw-size.json
          python3 -m unittest osenv.raw_size_test -v
      - name: Literal direct-entry CPU metadata and PCI gates
        run: |
          cd "$RUNNER_TEMP/osenv"
          python3 -m osenv raw-build --project "$GITHUB_WORKSPACE" --output build/raw-pvh --packed --pvh > os-raw-pvh-build.json
          python3 -m osenv.raw_pvh_test --build build/raw-pvh --report local/raw-pvh-boundaries.json --expected-bar 0xc0000000
          if python3 -m osenv.raw_pvh_test --build build/raw-pvh --report local/raw-pvh-mutant.json --expected-bar 0xc0000000 --mutant-magic; then
            echo "Missing PVH magic check was not detected"
            exit 1
          fi
          python3 -m osenv web-test --image build/raw-pvh/oslab.img --symbols build/raw-pvh/kernel.elf --boot-kernel build/raw-pvh/pvh.elf --production --minimal-devices > os-raw-pvh-wire.json
          python3 -m osenv raw-size --build build/raw-pvh --output local/raw-pvh-size > os-raw-pvh-size.json
          python3 -m unittest osenv.raw_size_test osenv.experiment_test osenv.acceleration_test osenv.capture_storage_test -v
      - name: Retain small OS acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-acceptance
          path: |
            ${{ runner.temp }}/osenv/os-gate.json
            ${{ runner.temp }}/osenv/os-machine-gate.json
            ${{ runner.temp }}/osenv/os-raw-build.json
            ${{ runner.temp }}/osenv/os-raw-gate.json
            ${{ runner.temp }}/osenv/os-raw-packed-build.json
            ${{ runner.temp }}/osenv/os-raw-packed-gate.json
            ${{ runner.temp }}/osenv/os-raw-decoder-gate.json
            ${{ runner.temp }}/osenv/os-raw-size.json
            ${{ runner.temp }}/osenv/os-raw-pvh-*.json
            ${{ runner.temp }}/osenv/local/raw-pvh-*.json
            ${{ runner.temp }}/osenv/local/raw-queue-mutant.json
            ${{ runner.temp }}/osenv/local/raw-pvh-size/**
            ${{ runner.temp }}/osenv/local/raw-packed-acceptance/**/*.json
            ${{ runner.temp }}/osenv/local/raw-decoder-acceptance/**/*.json
            ${{ runner.temp }}/osenv/local/raw-size/**
            ${{ runner.temp }}/osenv/build/**/packing-proof.json
            ${{ runner.temp }}/osenv/local/raw-acceptance/**/*.json
            ${{ runner.temp }}/osenv/build/**/build.log
            ${{ runner.temp }}/osenv/build/**/mutation-test.log
            ${{ runner.temp }}/osenv/build/**/manifest.json
            ${{ runner.temp }}/osenv/runs/**/serial.log
            ${{ runner.temp }}/osenv/runs/**/status.json
            ${{ runner.temp }}/osenv/runs/**/capture.json
